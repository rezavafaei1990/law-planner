plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.baraat.lawplanner'
    compileSdk 34

    defaultConfig {
        applicationId "ir.baraat.lawplanner"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        release {
            if (System.getenv("BARAAT_KEYSTORE_PATH") != null) {
                storeFile file(System.getenv("BARAAT_KEYSTORE_PATH"))
                storePassword System.getenv("BARAAT_KEYSTORE_PASS")
                keyAlias System.getenv("BARAAT_KEY_ALIAS")
                keyPassword System.getenv("BARAAT_KEY_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("BARAAT_KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
